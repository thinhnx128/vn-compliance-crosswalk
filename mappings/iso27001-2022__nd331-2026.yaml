# Bảng đối chiếu ISO/IEC 27001:2022 Phụ lục A -> Nghị định 331/2026/NĐ-CP
#
# Ý nghĩa quan hệ (theo cách tiếp cận tập hợp của NIST OLIR), xét từ biện pháp ISO (source):
#   equivalent   : cùng phạm vi
#   subset_of    : biện pháp ISO hẹp hơn, nằm trọn trong yêu cầu của Nghị định
#   superset_of  : biện pháp ISO rộng hơn, bao trùm yêu cầu của Nghị định
#   intersects   : giao nhau một phần - triển khai biện pháp ISO là bằng chứng một phần cho yêu cầu NĐ
#
# Giới hạn: danh mục ISO ở đây chỉ gồm Phụ lục A. Các điều khoản chính của ISO/IEC 27001 (4–10,
# ví dụ 6.1 đánh giá rủi ro, 9.2 đánh giá nội bộ) liên quan mật thiết tới Điều 10, 27, 31 nhưng
# chưa nằm trong bảng này. Xem `vncc coverage` để biết yêu cầu NĐ chưa có biện pháp ISO tương ứng.
