status: draft
notice: >-
  Tóm tắt nghĩa vụ do tác giả tự diễn đạt từ văn bản đăng tải công khai, đối chiếu ngày 31/10/2026.
  Căn cứ: Luật An ninh mạng 116/2025/QH15. Các mục gắn thẻ can-doi-chieu (Điều 33–37) chưa đối chiếu
  được toàn văn. Người dùng phải kiểm tra văn bản gốc trước khi sử dụng cho hồ sơ pháp lý.
