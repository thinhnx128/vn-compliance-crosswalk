      - id: D32.K5
        title: Đơn vị chuyên trách phối hợp đơn vị vận hành đánh giá rủi ro, dò quét lỗ hổng, kiểm thử xâm nhập
        tags: [don-vi-chuyen-trach, don-vi-van-hanh]
      - id: D33
