        tags: [don-vi-van-hanh, can-doi-chieu]

  - id: XD
    title: Xác định hệ thống thông tin và cấp độ
    controls:
      - id: D7.K1
        title: Xác định HTTT có chức năng nghiệp vụ, xử lý dữ liệu, đối tượng phục vụ và đầu ra rõ ràng
