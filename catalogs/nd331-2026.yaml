        title: Phê duyệt hồ sơ đề xuất cấp độ đúng thời điểm khi xây dựng mới hoặc mở rộng, nâng cấp HTTT
        tags: [chu-quan, can-doi-chieu]

  - id: CT
    title: Điều khoản chuyển tiếp
    controls:
      - id: D39.K1
        title: HTTT đầu tư trước ngày Luật An ninh mạng 2025 có hiệu lực - phê duyệt cấp độ trong 6 tháng, đáp ứng điều kiện trong 12 tháng
        summary: >-
          Hoàn thành thẩm định, phê duyệt cấp độ trong 6 tháng và đáp ứng đầy đủ điều kiện theo cấp độ
          trong 12 tháng kể từ ngày Luật An ninh mạng 116/2025/QH15 có hiệu lực.
        tags: [chu-quan]
