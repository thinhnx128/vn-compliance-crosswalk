        tags: [chu-quan]

  - id: RR
    title: Quản lý rủi ro an ninh mạng
    controls:
      - id: D10.K2
        title: Đánh giá rủi ro an ninh mạng khi xác định cấp độ lần đầu, khi thay đổi, mở rộng, tích hợp, sau sự cố nghiêm trọng hoặc theo yêu cầu
        tags: [chu-quan]
      - id: D10.K3
        title: Đánh giá rủi ro có đủ nội dung tối thiểu
        summary: >-
          Tài sản; loại thông tin; nhận diện rủi ro; khả năng và mức tác động; năng lực ứng phó;
          kế hoạch giảm thiểu; truyền thông và báo cáo rủi ro.
        tags: [chu-quan]
      - id: D10.K4
        title: Dùng kết quả đánh giá rủi ro làm căn cứ xác định cấp độ, lựa chọn biện pháp và điều chỉnh phương án
        tags: [chu-quan]
      - id: D10.K5
        title: Đề xuất cấp độ cao hơn khi rủi ro đánh giá được cao hơn cấp độ hiện tại
        tags: [chu-quan]
      - id: D10.K6
        title: Lưu giữ hồ sơ đánh giá rủi ro và cung cấp khi thanh tra, kiểm tra
        tags: [chu-quan]

  - id: HS
    title: Hồ sơ đề xuất, thẩm định và phê duyệt cấp độ
    controls:
      - id: D18.K4
        title: Tách khâu thẩm định khi đơn vị chuyên trách đồng thời là đơn vị vận hành HTTT
        summary: Giao đơn vị trực thuộc đủ năng lực chủ trì thẩm định hoặc thành lập Hội đồng thẩm định độc lập.
        tags: [chu-quan]
      - id: D19.K1
        title: Lồng ghép thuyết minh đề xuất cấp độ vào báo cáo nghiên cứu khả thi hoặc báo cáo đầu tư của dự án CNTT
        tags: [chu-quan]
      - id: D19.K2
        title: Lồng ghép thuyết minh đề xuất cấp độ vào kế hoạch thuê dịch vụ CNTT
        tags: [chu-quan]
      - id: D20
        title: Lập, thẩm định và phê duyệt hồ sơ đề xuất cấp độ cho HTTT đang vận hành theo đúng thẩm quyền
        summary: >-
          Cấp độ 1–2 do đơn vị chuyên trách thẩm định, phê duyệt; cấp độ 3 do chủ quản phê duyệt;
          cấp độ 4–5 do Bộ Công an chủ trì thẩm định (Điều 18, 20).
        tags: [chu-quan, don-vi-chuyen-trach]
      - id: D21
        title: Hồ sơ đề xuất cấp độ có đủ thành phần
        summary: >-
          Thuyết minh tổng quan; thiết kế hoặc tài liệu tương đương; thuyết minh đề xuất cấp độ;
          thuyết minh phương án bảo đảm an ninh mạng; ý kiến chuyên môn của đơn vị chuyên trách
          (cấp độ 4–5).
        tags: [chu-quan]
      - id: D22.K3
        title: Thuyết minh tổng quan nêu chủ quản, đơn vị vận hành, phạm vi, kiến trúc, thiết bị, dịch vụ và vùng địa chỉ IP
        tags: [chu-quan]
      - id: D22.K4
        title: Thuyết minh đề xuất cấp độ cho từng hệ thống kèm nhận diện rủi ro sơ bộ
        tags: [chu-quan]
      - id: D22.K5
        title: Bổ sung phân tích hệ thống liên quan, nguy cơ tấn công, tác động công cộng và yêu cầu vận hành 24/7
        tags: [chu-quan, cap-do-4, cap-do-5]
      - id: D22.K6
        title: Thuyết minh phương án mô tả cách đáp ứng từng yêu cầu bảo đảm an ninh mạng theo cấp độ
        tags: [chu-quan]
      - id: D25
        title: Xác định lại cấp độ theo trình tự như lần đầu khi HTTT đã phê duyệt có thay đổi
        tags: [chu-quan]

