        tags: [chu-quan, don-vi-van-hanh]
      - id: D5.K3.b
        title: Có điều khoản duy trì, chuyển giao hoặc thỏa thuận mới khi hết hạn dịch vụ thuê mà HTTT vẫn vận hành
        tags: [chu-quan]
