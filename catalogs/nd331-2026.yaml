# Danh mục yêu cầu Nghị định 331/2026/NĐ-CP về bảo vệ an ninh mạng đối với hệ thống thông tin.
#
# Chỉ gồm các điều khoản đặt ra NGHĨA VỤ cho chủ quản, đơn vị chuyên trách và đơn vị vận hành HTTT.
# Định nghĩa và tiêu chí xác định cấp độ (Điều 11–15) được tóm tắt riêng trong docs/nd331-cap-do.md.
#
# Quy ước:
#   id    : D<điều>.K<khoản>.<điểm>
#   tags  : cap-do-N  -> chỉ áp dụng cho cấp độ N (không có thẻ cap-do nghĩa là áp dụng mọi cấp độ)
#           chu-quan | don-vi-chuyen-trach | don-vi-van-hanh -> chủ thể thực hiện chính
#           can-doi-chieu -> nội dung tóm tắt chưa đối chiếu được toàn văn, phải kiểm tra văn bản gốc
#   title / summary: tác giả tự tóm tắt, không thay thế văn bản gốc.
kind: catalog
