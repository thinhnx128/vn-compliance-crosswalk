      - id: D7.K2
        title: Xác định phạm vi HTTT theo chức năng, luồng dữ liệu, mức phụ thuộc vận hành và phạm vi ảnh hưởng khi sự cố
        summary: Phạm vi phản ánh thực tế vận hành; với hệ thống liên thông phải xem xét khả năng lan truyền rủi ro.
