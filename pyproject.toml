[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "vn-compliance-crosswalk"
version = "0.3.1"
description = "Đối chiếu ISO/IEC 27001:2022 với quy định Việt Nam (NĐ 331/2026, Luật 91/2025) dưới dạng dữ liệu; sinh SoA và báo cáo khoảng cách."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Nguyen Xuan Thinh" }]
keywords = ["iso27001", "compliance", "grc", "isms", "vietnam", "crosswalk", "soa"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Natural Language :: Vietnamese",
  "Topic :: Security",
]
dependencies = ["typer>=0.12", "pydantic>=2.6", "pyyaml>=6", "openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
vncc = "vncc.cli:app"

[project.urls]
Homepage = "https://github.com/thinhnx128/vn-compliance-crosswalk"
Issues = "https://github.com/thinhnx128/vn-compliance-crosswalk/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/vncc"]

[tool.hatch.build.targets.wheel.force-include]
"catalogs" = "vncc/data/catalogs"
"mappings" = "vncc/data/mappings"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]  # độ dài dòng do ruff format quản lý; chuỗi tiếng Việt dài được giữ nguyên

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
